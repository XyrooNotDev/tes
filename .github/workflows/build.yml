name: Santanic Build APK

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Nama ZIP project yang diupload dari aplikasi"
        required: false
        default: "source.zip"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          ZIP_NAME="${{ inputs.source_zip }}"
          test -f "$ZIP_NAME" || { echo "::error::File $ZIP_NAME tidak ditemukan."; exit 1; }
          mkdir -p _santanic_source
          unzip -q "$ZIP_NAME" -d _santanic_source
          PROJECT_ROOT="$(find _santanic_source -name pubspec.yaml -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_ROOT" ]; then
            PROJECT_ROOT="$(find _santanic_source -name gradlew -printf '%h\n' | head -n 1)"
          fi
          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::ZIP tidak berisi pubspec.yaml atau gradlew"
            exit 1
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Sumber project ditemukan: $PROJECT_ROOT"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =============================================================
      # CACHE GRADLE — supaya dependency tidak didownload ulang
      # =============================================================
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/init.d
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Prepare Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =============================================================
      # MIRROR MAVEN — hindari 429 dari Maven Central
      # =============================================================
      - name: Install Gradle Maven mirror (anti 429)
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/00-santanic-mirror.gradle" <<'GRADLE_EOF'
          // Mirror Maven Central -> Google Storage + Aliyun
          // Dipakai untuk menghindari 429 Too Many Requests dari repo.maven.apache.org
          def mirrors = [
              'https://maven-central.storage-download.googleapis.com/maven2/',
              'https://maven.aliyun.com/repository/central',
              'https://maven.aliyun.com/repository/gradle-plugin',
              'https://maven.aliyun.com/repository/public',
          ]

          def applyMirror = { repositories ->
              mirrors.each { u -> repositories.maven { url u } }
              repositories.all { repo ->
                  if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                      def u = repo.url.toString()
                      if (u.contains('repo.maven.apache.org') || u.contains('repo1.maven.org')) {
                          // jangan disable total: biarkan sebagai fallback terakhir
                          // tapi prioritas lebih rendah sudah otomatis karena mirrors ditambahkan dulu
                      }
                  }
              }
          }

          beforeSettings { settings ->
              settings.pluginManagement.repositories { applyMirror(delegate) }
              settings.dependencyResolutionManagement.repositories { applyMirror(delegate) }
          }

          allprojects { proj ->
              proj.buildscript.repositories { applyMirror(delegate) }
              proj.repositories { applyMirror(delegate) }
          }
          GRADLE_EOF
          echo "Mirror Gradle terpasang di:"
          ls -la "$HOME/.gradle/init.d/"

      # =============================================================
      # RETRY CONFIG — biar Gradle otomatis retry saat kena 429
      # =============================================================
      - name: Configure Gradle retry & timeout
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=5
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          systemProp.org.gradle.internal.repository.max.backoff=60000
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          EOF
          echo "Gradle retry config terpasang."

      - name: Copy project into workspace
        shell: bash
        run: |
          cp -a "$PROJECT_ROOT"/. .
          echo "Files copied from uploaded ZIP"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret KEYSTORE_BASE64 kosong. Menggunakan debug keystore (SHA-1 akan berubah)."
            exit 0
          fi
          mkdir -p "$HOME/.santanic-keys"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.santanic-keys/santanic-release.jks"
          echo "KEYSTORE_PATH=$HOME/.santanic-keys/santanic-release.jks" >> "$GITHUB_ENV"
          echo "Keystore restored."

      - name: Configure release signing
        if: hashFiles('pubspec.yaml') != '' && env.KEYSTORE_PATH != ''
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f android/app/build.gradle ]; then
            echo "::warning::build.gradle tidak ditemukan, skip."
            exit 0
          fi
          cat > android/key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${KEYSTORE_PATH}
          EOF

          sed -i "/apply plugin: 'com.android.application'/a \\
          def keystoreProperties = new Properties()\\n\\
          def keystorePropertiesFile = rootProject.file('key.properties')\\n\\
          if (keystorePropertiesFile.exists()) {\\n\\
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\\n\\
          }" android/app/build.gradle

          sed -i "/android {/a \\
              signingConfigs {\\n\\
                  release {\\n\\
                      keyAlias keystoreProperties['keyAlias']\\n\\
                      keyPassword keystoreProperties['keyPassword']\\n\\
                      storeFile file(keystoreProperties['storeFile'])\\n\\
                      storePassword keystoreProperties['storePassword']\\n\\
                  }\\n\\
              }" android/app/build.gradle

          sed -i "/release {/a \\
                      signingConfig signingConfigs.release" android/app/build.gradle
          echo "Signing config berhasil disuntikkan."

      # =============================================================
      # BUILD FLUTTER — retry 5x dengan backoff + fallback tanpa split
      # =============================================================
      - name: Build Flutter APK
        if: hashFiles('pubspec.yaml') != ''
        shell: bash
        run: |
          flutter --version

          retry() {
            n=1
            until "$@"; do
              if [ "$n" -ge 5 ]; then return 1; fi
              echo "::warning::Percobaan $n gagal, mengulang dalam $((n*30)) detik..."
              sleep $((n*30))
              n=$((n+1))
            done
          }

          retry flutter pub get

          if retry flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --split-debug-info=build/symbols; then
            echo "✅ Build split-per-abi berhasil."
          else
            echo "::warning::Build split-per-abi gagal, mencoba build biasa (tanpa split)."
            retry flutter build apk --release --split-debug-info=build/symbols
          fi

      - name: Build Android Studio APK
        if: hashFiles('pubspec.yaml') == '' && hashFiles('gradlew') != ''
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_PATH" ]; then
            cat > key.properties <<EOF
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${KEYSTORE_PATH}
          EOF
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Print SHA-1 & SHA-256 fingerprint
        shell: bash
        run: |
          echo "=================================================="
          echo "     SIGNING KEY FINGERPRINT"
          echo "=================================================="
          if [ -n "$KEYSTORE_PATH" ]; then
            keytool -list -v -keystore "$KEYSTORE_PATH" -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | tee /tmp/fingerprint.txt
            SHA1=$(grep "SHA1:" /tmp/fingerprint.txt | head -n1 | sed 's/.*SHA1: //')
            SHA256=$(grep "SHA256:" /tmp/fingerprint.txt | head -n1 | sed 's/.*SHA256: //')
            echo "::notice title=SHA-1::$SHA1"
            echo "::notice title=SHA-256::$SHA256"
            mkdir -p santanic-output
            echo "SHA1=$SHA1" >> santanic-output/fingerprint.txt
            echo "SHA256=$SHA256" >> santanic-output/fingerprint.txt
          else
            echo "::warning::Menggunakan Debug Keystore (SHA-1 tidak persisten)."
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | tee /tmp/fingerprint.txt
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p santanic-output
          find . -type f -name '*.apk' -path '*/outputs/*' -not -path './santanic-output/*' -exec cp {} santanic-output/ \;
          if [ -z "$(find santanic-output -name '*.apk' -print -quit)" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi
          ls -lh santanic-output
          for f in santanic-output/*.apk; do
            SIZE=$(stat -c%s "$f")
            echo "$(basename "$f"): $((SIZE / 1024 / 1024)) MB"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Santanic-APK
          path: |
            santanic-output/*.apk
            santanic-output/fingerprint.txt
          if-no-files-found: error
          retention-days: 90