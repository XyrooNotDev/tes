name: Build Android Native APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project (dari Santanic Build)"
        required: true
        type: string
      tag:
        description: "Tag build"
        required: true
        type: string
      build_type:
        description: "Mode build"
        required: true
        type: choice
        default: release
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download ZIP
        shell: bash
        run: |
          curl -fL --retry 3 -H "Authorization: Bearer ${{ secrets.GH_TOKEN }}" \
            "${{ inputs.zip_url }}" -o project.zip
          test -s project.zip
          unzip -q project.zip -d project_raw

      - name: Detect Project Root
        shell: bash
        run: |
          GRADLEW=$(find project_raw -type f -name "gradlew" -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan di dalam ZIP. Pastikan ZIP berisi project Android."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "$APK")" >> "$GITHUB_ENV"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 1